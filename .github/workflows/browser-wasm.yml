name: browser-wasm

# Builds the LightUSD `core` WASM backend from a LightUSD checkout, publishes
# it as the stable `wasm-phase1` release, and redeploys GitHub Pages so
# /browser/wasm/lightusd.{js,wasm} are served same-origin.
#
# Defaults to lighttransport/LightUSD@mtlx-conformance. Override with repository
# variables (Settings > Variables > Actions):
#   LIGHTUSD_REPOSITORY   e.g. lighttransport/LightUSD
#   LIGHTUSD_REF          a pinned commit or branch with src/ + web/
# For a private LightUSD repo, also add the LIGHTUSD_TOKEN secret (repo scope).
#
# Manual only (workflow_dispatch): the LightUSD checkout is external and moves
# independently of this repo.

on:
  workflow_dispatch:
    inputs:
      lightusd_repository:
        description: 'LightUSD owner/name (default: repo variable LIGHTUSD_REPOSITORY)'
        required: false
      lightusd_ref:
        description: 'LightUSD commit or branch (default: repo variable LIGHTUSD_REF)'
        required: false
      emsdk_version:
        description: 'emsdk version to install'
        default: '7.0.0'

permissions:
  contents: read

jobs:
  build-lightusd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Resolve LightUSD source
        id: cfg
        env:
          IN_REPO: ${{ inputs.lightusd_repository }}
          IN_REF: ${{ inputs.lightusd_ref }}
          VAR_REPO: ${{ vars.LIGHTUSD_REPOSITORY }}
          VAR_REF: ${{ vars.LIGHTUSD_REF }}
        run: |
          # Precedence: dispatch input > repository variable > default.
          repo="${IN_REPO:-${VAR_REPO:-lighttransport/LightUSD}}"
          ref="${IN_REF:-${VAR_REF:-mtlx-conformance}}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building $repo@$ref"

      - name: Checkout LightUSD
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.cfg.outputs.repo }}
          ref: ${{ steps.cfg.outputs.ref }}
          path: lightusd
          submodules: recursive
          token: ${{ secrets.LIGHTUSD_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emsdk_version }}

      - name: Build LightUSD core WASM
        env:
          LIGHTUSD_ROOT: ${{ github.workspace }}/lightusd
        run: |
          git -C "$LIGHTUSD_ROOT" rev-parse HEAD
          bash pages/browser/build-wasm-lightusd.sh pages/browser/wasm

      - name: Smoke test the WASM backend
        run: node --experimental-default-type=module pages/browser/check-lightusd-wasm.mjs pages/browser/wasm

      - uses: actions/upload-artifact@v4
        with:
          name: lightusd-wasm
          path: |
            pages/browser/wasm/lightusd.js
            pages/browser/wasm/lightusd.wasm
            pages/browser/wasm/lightusd.sha256
            pages/browser/wasm/lightusd.revision
          if-no-files-found: error

  release:
    needs: build-lightusd
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: lightusd-wasm
          path: dist

      - name: Replace the stable wasm-phase1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete wasm-phase1 --yes --cleanup-tag || true

      - name: Create wasm-phase1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wasm-phase1
          name: Browser workbench WASM backend (phase 1)
          body: |
            LightUSD `core` WebAssembly module used by the browser workbench.
            Assets: `lightusd.js`, `lightusd.wasm`, `lightusd.sha256`.
          files: dist/*
          generate_release_notes: true

      - name: Redeploy GitHub Pages with the new binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --ref main || \
            echo "pages dispatch unavailable; the next push to pages/browser will redeploy"
